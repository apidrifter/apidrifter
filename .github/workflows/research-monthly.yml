name: Research monthly

# Monthly public API spec drift survey: discover candidates on apis.guru, run the
# read-only survey, aggregate results, write a draft post, and open a pull request.
# The only human step is reviewing and merging that pull request.

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Survey month as YYYY-MM (default: the current month)"
        required: false
        type: string
      limit:
        description: "Number of candidate APIs to survey"
        required: false
        default: "15"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-monthly
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Actions pinned by SHA; update via Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Resolve month and limit
        id: params
        env:
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          MONTH="${INPUT_MONTH:-$(date -u +%Y-%m)}"
          LIMIT="${INPUT_LIMIT:-15}"
          if ! [[ "$MONTH" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then echo "bad month: $MONTH" >&2; exit 1; fi
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then echo "bad limit: $LIMIT" >&2; exit 1; fi
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"

      - name: Discover candidates
        env:
          MONTH: ${{ steps.params.outputs.month }}
          LIMIT: ${{ steps.params.outputs.limit }}
        run: node tools/survey/discover.mjs --limit "$LIMIT" --seed "$MONTH"

      # run.mjs catches per-target failures and writes an error row; this guard keeps the
      # job alive even if the runner itself dies, so a partial month can still be reported.
      - name: Run survey
        continue-on-error: true
        env:
          MONTH: ${{ steps.params.outputs.month }}
        run: node tools/survey/run.mjs --targets tools/survey/candidates.json --month "$MONTH"

      - name: Report and draft post
        env:
          MONTH: ${{ steps.params.outputs.month }}
        run: node tools/survey/report.mjs --month "$MONTH" --targets tools/survey/candidates.json

      - name: Format generated JSON
        run: pnpm exec biome format --write tools/survey/candidates.json tools/survey/surveyed.json

      - name: Open pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: research/${{ steps.params.outputs.month }}
          base: main
          delete-branch: true
          title: "Research: public API spec drift ${{ steps.params.outputs.month }} (draft)"
          commit-message: "Survey: public API spec drift ${{ steps.params.outputs.month }}"
          author: apidrifter <apidrifter@gmail.com>
          committer: apidrifter <apidrifter@gmail.com>
          signoff: true
          body-path: tools/survey/out/${{ steps.params.outputs.month }}/pr-body.md
          labels: research
          add-paths: |
            tools/survey/results/${{ steps.params.outputs.month }}/**
            tools/survey/candidates.json
            tools/survey/surveyed.json
            apps/web/src/content/research/public-api-spec-drift-${{ steps.params.outputs.month }}.mdx
