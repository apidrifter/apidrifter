name: "Driftwatch"
description: "Fail on breaking API changes between two OpenAPI documents or MCP snapshots, with a changelog in the job summary and optionally on the pull request."
branding:
  icon: "git-pull-request"
  color: "orange"

inputs:
  before:
    description: "Path to the previous document"
    required: true
  after:
    description: "Path to the new document"
    required: true
  fail-on:
    description: "breaking, warning or info"
    required: false
    default: "breaking"
  config:
    description: "Path to a driftwatch config file"
    required: false
    default: ""
  version:
    description: "driftwatch npm version to run"
    required: false
    default: "0.1.0"
  github-token:
    description: "Token used to post the changelog as a pull request comment. Leave empty to skip."
    required: false
    default: ""

outputs:
  breaking:
    description: "Number of breaking changes"
    value: ${{ steps.breaking.outputs.breaking }}

runs:
  using: "composite"
  steps:
    - id: changelog
      shell: bash
      env:
        DW_BEFORE: ${{ inputs.before }}
        DW_AFTER: ${{ inputs.after }}
        DW_CONFIG: ${{ inputs.config }}
        DW_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "$DW_CONFIG" ]; then args+=(--config "$DW_CONFIG"); fi
        npx --yes "driftwatch@${DW_VERSION}" changelog "$DW_BEFORE" "$DW_AFTER" --fail-on info "${args[@]}" > driftwatch-changelog.md || true
        cat driftwatch-changelog.md >> "$GITHUB_STEP_SUMMARY"

    - id: breaking
      shell: bash
      env:
        DW_BEFORE: ${{ inputs.before }}
        DW_AFTER: ${{ inputs.after }}
        DW_CONFIG: ${{ inputs.config }}
        DW_VERSION: ${{ inputs.version }}
        DW_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        args=()
        if [ -n "$DW_CONFIG" ]; then args+=(--config "$DW_CONFIG"); fi
        npx --yes "driftwatch@${DW_VERSION}" diff "$DW_BEFORE" "$DW_AFTER" --format json --fail-on "$DW_FAIL_ON" "${args[@]}" > driftwatch-result.json
        status=$?
        count=$(node -e 'const r=JSON.parse(require("fs").readFileSync("driftwatch-result.json","utf8"));process.stdout.write(String(r.summary.breaking))' 2>/dev/null || echo 0)
        echo "breaking=$count" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - if: ${{ inputs.github-token != '' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        gh pr comment "$PR_NUMBER" --body-file driftwatch-changelog.md

    - shell: bash
      env:
        DW_STATUS: ${{ steps.breaking.outputs.status }}
      run: |
        if [ "$DW_STATUS" != "0" ]; then
          echo "driftwatch found changes at or above the fail-on level"
          exit 1
        fi
